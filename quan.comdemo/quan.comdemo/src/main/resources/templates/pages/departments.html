<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng ban - HATECHNO HRM</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/hrm-custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="sidebar-mobile-overlay" id="sidebarOverlay"></div>
<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="sidebar-brand">HATECHNO<span>HR Management</span></div>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-chart-pie"></i></div><span class="nav-label">Dashboard</span></a>
            <a href="/employees" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span class="nav-label">Nhân viên</span></a>
            <a href="/departments" class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-building"></i></div><span class="nav-label">Phòng ban</span></a>
            <a href="/positions" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-briefcase"></i></div><span class="nav-label">Chức vụ</span></a>
            <a href="/attendance" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-calendar-check"></i></div><span class="nav-label">Chấm công</span></a>
            <a href="/schedule" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-calendar-days"></i></div><span class="nav-label">Theo dõi Lịch làm</span></a>
            <a href="/salary" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-money-bill-wave"></i></div><span class="nav-label">Bảng lương</span></a>
            <a href="/my-salary" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span class="nav-label">Lương cá nhân</span></a>
            <a href="/rewards" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-trophy"></i></div><span class="nav-label">Thưởng / KL</span></a>
            <a href="/leaves" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-calendar-xmark"></i></div><span class="nav-label">Nghỉ phép</span></a>
            <a href="/reports" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-chart-bar"></i></div><span class="nav-label">Báo cáo</span></a>
            <a href="/profile" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-circle-user"></i></div><span class="nav-label">Hồ sơ cá nhân</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <img src="" class="sidebar-user-avatar" id="sidebarAvatar" alt="">
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarUserName"></div>
                    <div class="sidebar-user-role" id="sidebarUserRole"></div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <nav class="navbar-top">
            <button class="navbar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
            <span class="navbar-title">Quản lý Phòng ban</span>
            <div class="navbar-actions" style="margin-left:auto">
                <button id="themeToggle" class="theme-toggle"></button>
                <div class="dropdown">
                    <img src="" alt="" class="navbar-avatar" id="navAvatar" data-dropdown-toggle="navDropdown">
                    <div class="dropdown-menu" id="navDropdown">
                        <a href="/profile" class="dropdown-item"><i class="fa-solid fa-user"></i> Hồ sơ</a>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</div>
                    </div>
                </div>
            </div>
        </nav>

        <div class="page-content">
            <div class="page-header">
                <div class="page-title"><i class="fa-solid fa-building"></i> Quản lý Phòng ban</div>
                <button class="btn btn-primary" id="btnAdd"><i class="fa-solid fa-plus"></i> Thêm phòng ban</button>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên phòng ban</th>
                            <th>Trưởng phòng</th>
                            <th>Số nhân viên</th>
                            <th>Mô tả</th>
                            <th style="text-align:center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div class="pagination-wrap">
                    <div class="pagination-info" id="paginationInfo"></div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Thêm/Sửa Phòng Ban -->
<div class="modal" id="mainModal">
    <div class="modal-card" style="max-width:500px">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle"><i class="fa-solid fa-building"></i> Thêm phòng ban</div>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body">
            <form id="mainForm">
                <input type="hidden" id="itemId">
                <div class="form-group">
                    <label class="form-label">Tên phòng ban <span class="required">*</span></label>
                    <input type="text" class="form-control" id="fTen" placeholder="Nhập tên phòng ban..." required>
                </div>
                <div class="form-group">
                    <label class="form-label">Trưởng phòng</label>
                    <select class="form-control" id="fTruong">
                        <option value="">-- Chọn trưởng phòng --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control" id="fMoTa" rows="3" placeholder="Nhập mô tả..."></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="modalCancel">Hủy</button>
            <button class="btn btn-primary" id="btnSave"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
        </div>
    </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/main.js"></script>
<script>
    AuthCheck.require();
    let editId = null, currentPage = 1;

    async function loadData() {
        const res = await API.get('/departments');
        const data = res?.data?.data || [];
        const isManager = AuthCheck.hasRole(['Admin','NhanSu']);

        const totalPages = Math.ceil(data.length / 10) || 1;
        const displayData = data.slice((currentPage - 1) * 10, currentPage * 10);
        const offset = (currentPage - 1) * 10;

        document.getElementById('tableBody').innerHTML = displayData.length
            ? displayData.map((d,i) => `<tr>
                <td>${offset+i+1}</td>
                <td><strong>${Utils.escHtml(d.TenPhongBan)}</strong></td>
                <td><span style="font-weight:500">${Utils.escHtml(d.TenTruongPhong||'--')}</span></td>
                <td><span class="badge badge-info">${d.SoNhanVien||0} nhân viên</span></td>
                <td style="font-size:12px;color:var(--text-secondary)">${Utils.escHtml(d.MoTa||'--')}</td>
                <td style="text-align:center">
                    <div class="action-buttons" style="justify-content:center">
                        ${isManager ? `
                        <button class="btn btn-sm btn-outline-primary btn-icon" onclick="editItem(${d.MaPhongBan})"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger btn-icon" onclick="delItem(${d.MaPhongBan},'${Utils.escHtml(d.TenPhongBan)}')"><i class="fa-solid fa-trash"></i></button>
                        ` : '--'}
                    </div>
                </td>
            </tr>`).join('')
            : `<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-building"></i><p>Chưa có phòng ban</p></div></td></tr>`;

        document.getElementById('paginationInfo').textContent = `Tổng: ${data.length} phòng ban`;
        const pag = document.getElementById('pagination');
        pag.innerHTML = '';
        for (let p = 1; p <= Math.min(totalPages, 8); p++) {
            const btn = document.createElement('button');
            btn.className = `page-btn${p === currentPage ? ' active' : ''}`;
            btn.textContent = p;
            btn.onclick = () => { currentPage = p; loadData(); };
            pag.appendChild(btn);
        }
    }

    async function loadManagers() {
        const res = await API.get('/employees/simple');
        const sel = document.getElementById('fTruong');
        sel.innerHTML = '<option value="">-- Chọn trưởng phòng --</option>' + (res?.data?.data||[]).map(e => `<option value="${e.MaNhanVien}">${Utils.escHtml(e.HoTen)}</option>`).join('');
    }

    document.getElementById('btnAdd').addEventListener('click', () => {
        editId = null;
        document.getElementById('mainForm').reset();
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-building"></i> Thêm phòng ban';
        loadManagers();
        document.getElementById('mainModal').classList.add('active');
    });

    document.getElementById('modalClose').addEventListener('click', () => document.getElementById('mainModal').classList.remove('active'));
    document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('mainModal').classList.remove('active'));

    async function editItem(id) {
        const res = await API.get(`/departments/${id}`);
        if (!res?.ok) return;
        const d = res.data.data; editId = id;
        await loadManagers();
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen"></i> Cập nhật phòng ban';
        document.getElementById('fTen').value = d.TenPhongBan || '';
        document.getElementById('fTruong').value = d.TruongPhong || '';
        document.getElementById('fMoTa').value = d.MoTa || '';
        document.getElementById('mainModal').classList.add('active');
    }

    function delItem(id, name) {
        Confirm.show(`Xóa phòng ban <strong>${name}</strong>?`, 'Xóa phòng ban', 'Xóa', async () => {
            const res = await API.delete(`/departments/${id}`);
            res?.ok ? (Toast.success('Đã xóa'), loadData()) : Toast.error(res?.data?.message||'Lỗi xóa');
        });
    }

    document.getElementById('btnSave').addEventListener('click', async () => {
        const data = {
            tenPhongBan: document.getElementById('fTen').value.trim(),
            truongPhong: document.getElementById('fTruong').value || null,
            moTa: document.getElementById('fMoTa').value
        };
        if (!data.tenPhongBan) return Toast.warning('Vui lòng nhập tên phòng ban');
        const res = editId ? await API.put(`/departments/${editId}`, data) : await API.post('/departments', data);
        if (res?.ok) {
            Toast.success(editId ? 'Cập nhật thành công' : 'Thêm thành công');
            document.getElementById('mainModal').classList.remove('active');
            loadData();
        } else {
            Toast.error(res?.data?.message || 'Lỗi lưu');
        }
    });

    loadData();
</script>
</body>
</html>
