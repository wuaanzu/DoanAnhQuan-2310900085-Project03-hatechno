<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hatechno HRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-subtle d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="card shadow-lg border-0 style-card" style="width: 500px; border-radius: 12px;">
    <div class="card-body p-4">
        <!-- Logo / Brand -->
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-plus text-primary display-4 mb-2"></i>
            <h3 class="fw-bold text-dark">HATECHNO HRM</h3>
            <p class="text-muted small">Tạo tài khoản người dùng mới</p>
        </div>

        <div class="alert alert-danger d-none" id="regAlert"></div>
        <div class="alert alert-success d-none" id="regSuccess">Đăng ký thành công! Đang chuyển đến trang đăng nhập...</div>

        <!-- Form Register -->
        <form id="regForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="hoTen" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="hoTen" name="hoTen" placeholder="Nhập họ và tên" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="tenDangNhap" class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-at"></i></span>
                    <input type="text" class="form-control" id="tenDangNhap" name="tenDangNhap" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="dienThoai" class="form-label fw-semibold">Số điện thoại</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" class="form-control" id="dienThoai" name="dienThoai" placeholder="Nhập số điện thoại">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="confirmPassword" class="form-label fw-semibold">Xác nhận MK <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại MK" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="maPhongBan" class="form-label fw-semibold">Phòng ban</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-building"></i></span>
                        <select class="form-select" id="maPhongBan" name="maPhongBan">
                            <option value="">-- Chọn phòng ban --</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="maChucVu" class="form-label fw-semibold">Chức vụ</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-briefcase"></i></span>
                        <select class="form-select" id="maChucVu" name="maChucVu">
                            <option value="3">Nhân Viên</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="avatarInput" class="form-label fw-semibold">Ảnh đại diện</label>
                <input class="form-control" type="file" id="avatarInput" name="avatar" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3" id="regBtn">
                <i class="fa-solid fa-user-plus me-2"></i> Đăng ký tài khoản
            </button>

            <div class="text-center small">
                Đã có tài khoản? <a href="/login" class="fw-bold text-primary text-decoration-none">Đăng nhập ngay</a>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Load departments & positions dropdown
    async function loadSelects() {
        try {
            const [depts, pos] = await Promise.all([
                fetch('/api/departments').then(r => r.json()),
                fetch('/api/positions').then(r => r.json())
            ]);

            if (depts.data) {
                const sel = document.getElementById('maPhongBan');
                depts.data.forEach(d => {
                    sel.innerHTML += `<option value="${d.MaPhongBan}">${d.TenPhongBan}</option>`;
                });
            }

            if (pos.data) {
                const sel = document.getElementById('maChucVu');
                sel.innerHTML = '';
                pos.data.forEach(p => {
                    sel.innerHTML += `<option value="${p.MaChucVu}"${p.MaChucVu == 3 ? ' selected' : ''}>${p.TenChucVu}</option>`;
                });
            }
        } catch(e) {
            console.log('Không thể tải danh sách phòng ban/chức vụ:', e);
        }
    }
    loadSelects();

    // Submit handler
    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('regAlert');
        const successBox = document.getElementById('regSuccess');
        alertBox.classList.add('d-none');
        successBox.classList.add('d-none');

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            alertBox.textContent = 'Mật khẩu xác nhận không khớp!';
            alertBox.classList.remove('d-none');
            return;
        }

        if (password.length < 6) {
            alertBox.textContent = 'Mật khẩu phải có ít nhất 6 ký tự!';
            alertBox.classList.remove('d-none');
            return;
        }

        const formData = new FormData(this);

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.success) {
                successBox.classList.remove('d-none');
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                alertBox.textContent = data.message || 'Đăng ký thất bại!';
                alertBox.classList.remove('d-none');
            }
        } catch(err) {
            alertBox.textContent = 'Lỗi kết nối máy chủ!';
            alertBox.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
