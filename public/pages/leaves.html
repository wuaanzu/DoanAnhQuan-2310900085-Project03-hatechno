<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghỉ phép - HATECHNO HRM</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/hrm-custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="sidebar-mobile-overlay" id="sidebarOverlay"></div>
<div class="app-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><i class="fa-solid fa-shield-halved"></i></div><div class="sidebar-brand">HATECHNO<span>HR Management</span></div></div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-chart-pie"></i></div><span class="nav-label">Dashboard</span></a>
            <a href="/employees" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span class="nav-label">Nhân viên</span></a>
            <a href="/departments" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-building"></i></div><span class="nav-label">Phòng ban</span></a>
            <a href="/positions" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-briefcase"></i></div><span class="nav-label">Chức vụ</span></a>
            <a href="/attendance" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-calendar-check"></i></div><span class="nav-label">Chấm công</span></a>
            <a href="/salary" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-money-bill-wave"></i></div><span class="nav-label">Bảng lương</span></a>
            <a href="/rewards" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-trophy"></i></div><span class="nav-label">Thưởng / KL</span></a>
            <a href="/leaves" class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-calendar-xmark"></i></div><span class="nav-label">Nghỉ phép</span></a>
            <a href="/reports" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-chart-bar"></i></div><span class="nav-label">Báo cáo</span></a>
            <a href="/profile" class="nav-item"><div class="nav-icon"><i class="fa-solid fa-circle-user"></i></div><span class="nav-label">Hồ sơ cá nhân</span></a>
        </nav>
        <div class="sidebar-footer"><div class="sidebar-user"><img src="" class="sidebar-user-avatar" id="sidebarAvatar" alt=""><div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebarUserName"></div><div class="sidebar-user-role" id="sidebarUserRole"></div></div></div></div>
    </aside>
    <div class="main-content" id="mainContent">
        <nav class="navbar-top">
            <button class="navbar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
            <span class="navbar-title">Quản lý Nghỉ phép</span>
            <div class="navbar-actions" style="margin-left:auto">
                <button id="themeToggle" class="theme-toggle"></button>
                <div class="dropdown"><img src="" alt="" class="navbar-avatar" id="navAvatar" data-dropdown-toggle="navDropdown"><div class="dropdown-menu" id="navDropdown"><a href="/profile" class="dropdown-item"><i class="fa-solid fa-user"></i> Hồ sơ</a><div class="dropdown-divider"></div><div class="dropdown-item danger" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</div></div></div>
            </div>
        </nav>
        <div class="page-content">
            <div class="page-header">
                <div><div class="page-title"><i class="fa-solid fa-calendar-xmark"></i> Quản lý Nghỉ phép</div></div>
                <button class="btn btn-primary" id="btnAdd"><i class="fa-solid fa-plus"></i> Xin nghỉ phép</button>
            </div>
            <div class="card">
                <div class="filter-bar">
                    <select class="form-control" id="filterStatus">
                        <option value="">Tất cả trạng thái</option>
                        <option value="ChoDuyet">⏳ Chờ duyệt</option>
                        <option value="DaDuyet">✅ Đã duyệt</option>
                        <option value="TuChoi">❌ Từ chối</option>
                    </select>
                    <div class="input-group" style="flex:1;max-width:250px">
                        <span class="input-group-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" class="form-control" placeholder="Tìm nhân viên..." id="filterSearch">
                    </div>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>STT</th><th>Nhân viên</th><th>Phòng ban</th><th>Ngày bắt đầu</th><th>Ngày kết thúc</th><th>Số ngày</th><th>Lý do</th><th>Trạng thái</th><th style="text-align:center">Thao tác</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div class="pagination-wrap"><div class="pagination-info" id="paginationInfo"></div><div class="pagination" id="pagination"></div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="mainModal">
    <div class="modal-box">
        <div class="modal-header"><div class="modal-title" id="modalTitle"><i class="fa-solid fa-calendar-xmark"></i> Xin nghỉ phép</div><button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="modal-body">
            <form id="mainForm"><input type="hidden" id="itemId">
                <div class="form-group" id="nhanVienGroup"><label class="form-label">Nhân viên</label><select class="form-control" id="fNhanVien"><option value="">-- Chọn NV --</option></select></div>
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">Ngày bắt đầu <span class="required">*</span></label><input type="date" class="form-control" id="fNgayBD"></div>
                    <div class="form-group"><label class="form-label">Ngày kết thúc <span class="required">*</span></label><input type="date" class="form-control" id="fNgayKT"></div>
                </div>
                <div class="form-group"><label class="form-label">Lý do</label><textarea class="form-control" id="fLyDo" rows="3" placeholder="Nhập lý do nghỉ..."></textarea></div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="modalCancel">Hủy</button>
            <button class="btn btn-primary" id="modalSave"><i class="fa-solid fa-paper-plane"></i> Gửi đơn</button>
        </div>
    </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/main.js"></script>
<script>
    AuthCheck.require();
    let currentPage=1, editId=null;
    const isManager = () => AuthCheck.hasRole(['Admin', 'NhanSu']);
    const isEmployee = () => !isManager();

    async function loadDropdowns() {
        if (isManager()) {
            const res = await API.get('/employees/simple');
            const sel = document.getElementById('fNhanVien');
            sel.innerHTML = '<option value="">-- Chọn NV --</option>';
            (res?.data?.data||[]).forEach(e => sel.innerHTML += `<option value="${e.MaNhanVien}">${Utils.escHtml(e.HoTen)}</option>`);
        } else {
            document.getElementById('nhanVienGroup').style.display = 'none';
        }
    }

    async function loadData() {
        const params = Utils.buildQuery({ page: currentPage, limit: 20, trangThai: document.getElementById('filterStatus').value, search: document.getElementById('filterSearch').value });
        const res = await API.get(`/leaves?${params}`);
        if (!res?.ok) return;
        const { data, pagination } = res.data;
        const offset = (pagination.page-1)*pagination.limit;

        document.getElementById('tableBody').innerHTML = data.length ?
            data.map((d,i) => `
                <tr>
                    <td>${offset+i+1}</td>
                    <td><div class="employee-cell">${Utils.getAvatarHtml(d.Avatar,d.HoTen,32)}<div><div class="employee-name">${Utils.escHtml(d.HoTen)}</div></div></div></td>
                    <td>${Utils.escHtml(d.TenPhongBan||'--')}</td>
                    <td>${Utils.formatDate(d.NgayBatDau)}</td>
                    <td>${Utils.formatDate(d.NgayKetThuc)}</td>
                    <td><span class="badge badge-pending">${d.SoNgay || 1} ngày</span></td>
                    <td style="max-width:180px;font-size:12px;color:var(--text-secondary)">${Utils.escHtml(d.LyDo||'--')}</td>
                    <td>${Utils.leaveBadge(d.TrangThai)}</td>
                    <td>
                        <div class="action-buttons" style="justify-content:center">
                            ${isManager() && d.TrangThai === 'ChoDuyet' ? `
                            <button class="btn btn-sm btn-success btn-icon" onclick="approve(${d.MaDon})" title="Duyệt"><i class="fa-solid fa-check"></i></button>
                            <button class="btn btn-sm btn-danger btn-icon" onclick="reject(${d.MaDon})" title="Từ chối"><i class="fa-solid fa-xmark"></i></button>
                            ` : ''}
                            ${isManager() ? `<button class="btn btn-sm btn-danger btn-icon" onclick="del(${d.MaDon})" title="Xóa"><i class="fa-solid fa-trash"></i></button>` : ''}
                            ${!isManager() && d.TrangThai === 'ChoDuyet' ? `<span class="text-muted text-sm">Đang chờ duyệt</span>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('') : `<tr><td colspan="9"><div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i><p>Không có đơn nghỉ phép</p></div></td></tr>`;

        document.getElementById('paginationInfo').textContent = `Tổng: ${pagination.total} đơn`;
        const pag = document.getElementById('pagination');
        pag.innerHTML = '';
        for (let p=1; p<=Math.min(pagination.totalPages,8); p++) {
            const btn = document.createElement('button');
            btn.className = `page-btn${p===pagination.page?' active':''}`;
            btn.textContent = p; btn.onclick = () => { currentPage=p; loadData(); };
            pag.appendChild(btn);
        }
    }

    async function approve(id) {
        const res = await API.put(`/leaves/${id}/approve`, {});
        res?.ok ? (Toast.success('Đã duyệt đơn nghỉ phép'), loadData()) : Toast.error('Lỗi duyệt đơn');
    }

    async function reject(id) {
        const res = await API.put(`/leaves/${id}/reject`, {});
        res?.ok ? (Toast.warning('Đã từ chối đơn nghỉ phép'), loadData()) : Toast.error('Lỗi từ chối');
    }

    function del(id) {
        Confirm.show('Xóa đơn nghỉ phép này?', 'Xóa', 'Xóa', async () => {
            const res = await API.delete(`/leaves/${id}`);
            res?.ok ? (Toast.success('Đã xóa'), loadData()) : Toast.error('Lỗi xóa');
        });
    }

    document.getElementById('btnAdd').addEventListener('click', () => {
        editId = null;
        document.getElementById('mainForm').reset();
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-calendar-plus"></i> Xin nghỉ phép';
        document.getElementById('fNgayBD').value = new Date().toISOString().split('T')[0];
        document.getElementById('fNgayKT').value = new Date().toISOString().split('T')[0];
        loadDropdowns();
        document.getElementById('mainModal').classList.add('active');
    });

    document.getElementById('modalClose').addEventListener('click', () => document.getElementById('mainModal').classList.remove('active'));
    document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('mainModal').classList.remove('active'));
    document.getElementById('modalSave').addEventListener('click', async () => {
        const data = {
            maNhanVien: document.getElementById('fNhanVien').value || undefined,
            ngayBatDau: document.getElementById('fNgayBD').value,
            ngayKetThuc: document.getElementById('fNgayKT').value,
            lyDo: document.getElementById('fLyDo').value
        };
        if (!data.ngayBatDau || !data.ngayKetThuc) return Toast.warning('Vui lòng chọn ngày nghỉ');
        const res = await API.post('/leaves', data);
        if (res?.ok) { Toast.success('Đã gửi đơn nghỉ phép'); document.getElementById('mainModal').classList.remove('active'); loadData(); }
        else Toast.error(res?.data?.message || 'Lỗi gửi đơn');
    });

    document.getElementById('filterStatus').addEventListener('change', () => { currentPage=1; loadData(); });
    document.getElementById('filterSearch').addEventListener('input', Utils.debounce(() => { currentPage=1; loadData(); }, 400));
    loadData();
</script>
</body>
</html>
