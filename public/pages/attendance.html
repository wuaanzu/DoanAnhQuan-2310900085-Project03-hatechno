<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm công - HATECHNO HRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<div class="app-layout">
    <div class="sidebar-wrapper"><div id="sidebar"></div></div>
    <div class="content-wrapper">
        <div id="topNavbar"></div>
        <div class="page-content">
            <div class="page-header">
                <h5><span class="page-icon"><i class="fa-solid fa-calendar-check"></i></span>Quản lý Chấm công</h5>
                <button class="btn btn-primary btn-sm" id="btnAdd"><i class="fa-solid fa-plus me-2"></i>Thêm chấm công</button>
            </div>
            <div class="card shadow-sm">
                <div class="filter-bar">
                    <select class="form-select form-select-sm" id="filterThang" style="max-width:130px">
                        <option value="">Tất cả tháng</option>
                    </select>
                    <select class="form-select form-select-sm" id="filterNam" style="max-width:100px">
                        <option value="2026">2026</option><option value="2025">2025</option>
                    </select>
                    <div class="input-group input-group-sm" style="max-width:220px">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                        <input type="text" class="form-control" id="filterSearch" placeholder="Tìm nhân viên...">
                    </div>
                    <button class="btn btn-sm btn-outline-secondary" id="btnRefresh"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light"><tr><th>STT</th><th>Nhân viên</th><th>Ngày làm</th><th>Giờ vào</th><th>Giờ ra</th><th>Số giờ</th><th>Tăng ca</th><th>Trạng thái</th><th class="text-center">Thao tác</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div class="pagination-bar">
                    <span id="paginationInfo" class="text-muted small">Đang tải...</span>
                    <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="mainModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white"><h5 class="modal-title fw-bold" id="modalTitle">Chấm công</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="mainForm"><input type="hidden" id="itemId">
                    <div class="mb-3"><label class="form-label fw-semibold">Nhân viên <span class="text-danger">*</span></label><select class="form-select" id="fNhanVien" required><option value="">-- Chọn nhân viên --</option></select></div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label fw-semibold">Ngày làm <span class="text-danger">*</span></label><input type="date" class="form-control" id="fNgayLam"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Trạng thái</label>
                            <select class="form-select" id="fTrangThai"><option>Đúng giờ</option><option>Đi muộn</option><option>Tăng ca</option><option>Nghỉ phép</option></select>
                        </div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Giờ vào</label><input type="time" class="form-control" id="fGioVao" value="08:00"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Giờ ra</label><input type="time" class="form-control" id="fGioRa" value="17:00"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Số giờ làm</label><input type="number" class="form-control" id="fSoGioLam" step="0.5" value="8"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Tăng ca (giờ)</label><input type="number" class="form-control" id="fTangCa" step="0.5" value="0"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" id="btnSave"><i class="fa-solid fa-floppy-disk me-2"></i>Lưu</button></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    requireAuth(); renderLayout('attendance');
    let currentPage=1, editId=null;
    const bsModal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('mainModal'));
    const statusBadge = s => ({
        'Đúng giờ':'<span class="badge bg-success-subtle text-success border border-success-subtle">✅ Đúng giờ</span>',
        'Đi muộn':'<span class="badge bg-warning-subtle text-warning border border-warning-subtle">⚠️ Đi muộn</span>',
        'Tăng ca':'<span class="badge bg-info-subtle text-info border border-info-subtle">⏰ Tăng ca</span>',
        'Nghỉ phép':'<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">📅 Nghỉ phép</span>',
    })[s] || s;

    // Sinh danh sách tháng (1-12) cho dropdown filterThang
    (function populateMonthSelect() {
        const currentMonth = new Date().getMonth() + 1;
        let optionsHtml = '';
        for (let i = 1; i <= 12; i++) {
            optionsHtml += `<option value="${i}"${i === currentMonth ? ' selected' : ''}>Tháng ${i}</option>`;
        }
        document.getElementById('filterThang').insertAdjacentHTML('beforeend', optionsHtml);
    })();

    async function loadNhanVien() {
        const res = await API.get('/employees/simple');
        const sel = document.getElementById('fNhanVien');
        sel.innerHTML = '<option value="">-- Chọn nhân viên --</option>' + (res?.data?.data||[]).map(e=>`<option value="${e.MaNhanVien}">${fmt.esc(e.HoTen)} (${e.MaNV})</option>`).join('');
    }

    async function loadData() {
        const params = new URLSearchParams({ page:currentPage, limit:20, thang:document.getElementById('filterThang').value, nam:document.getElementById('filterNam').value, search:document.getElementById('filterSearch').value });
        const res = await API.get(`/attendance?${params}`);
        if (!res?.ok) return;
        const { data, pagination } = res.data;
        const isManager = hasRole(['Admin','NhanSu']);
        const offset = (pagination.page-1)*pagination.limit;
        document.getElementById('tableBody').innerHTML = data.length
            ? data.map((d,i)=>`<tr>
                <td class="text-muted">${offset+i+1}</td>
                <td><div class="employee-cell">${badges.avatar(d.Avatar,d.HoTen)}<div><div class="employee-name">${fmt.esc(d.HoTen)}</div><div class="employee-code">${d.MaNV}</div></div></div></td>
                <td>${fmt.date(d.NgayLam)}</td>
                <td>${d.GioVao||'--'}</td>
                <td>${d.GioRa||'--'}</td>
                <td><strong>${d.SoGioLam||0}h</strong></td>
                <td>${d.TangCa>0?`<span class="badge bg-info-subtle text-info">+${d.TangCa}h</span>`:'--'}</td>
                <td>${statusBadge(d.TrangThai)}</td>
                <td class="text-center"><div class="d-flex gap-1 justify-content-center">
                    ${isManager?`<button class="btn btn-sm btn-outline-primary" onclick="editItem(${d.MaChamCong})"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="delItem(${d.MaChamCong})"><i class="fa-solid fa-trash"></i></button>`:'--'}
                </div></td>
            </tr>`).join('')
            : `<tr><td colspan="9" class="text-center py-5 text-muted"><i class="fa-solid fa-calendar-xmark fa-2x mb-2 d-block"></i>Không có dữ liệu</td></tr>`;
        document.getElementById('paginationInfo').textContent = `Tổng: ${pagination.total} bản ghi`;
        const pag = document.getElementById('pagination');
        pag.innerHTML = Array.from({length:Math.min(pagination.totalPages,8)},(_,i)=>`<li class="page-item${i+1===pagination.page?' active':''}"><a class="page-link" href="#" onclick="goPage(${i+1})">${i+1}</a></li>`).join('');
    }
    function goPage(p){ currentPage=p; loadData(); }
    document.getElementById('btnAdd')?.addEventListener('click', ()=>{ editId=null; document.getElementById('mainForm').reset(); document.getElementById('fNgayLam').value=new Date().toISOString().split('T')[0]; document.getElementById('modalTitle').textContent='Thêm chấm công'; loadNhanVien(); bsModal().show(); });
    async function editItem(id){ const res=await API.get(`/attendance/${id}`); if(!res?.ok)return; const d=res.data.data; editId=id; loadNhanVien(); document.getElementById('fNhanVien').value=d.MaNhanVien; document.getElementById('fNgayLam').value=d.NgayLam?.split('T')[0]||''; document.getElementById('fGioVao').value=d.GioVao?.slice(0,5)||'08:00'; document.getElementById('fGioRa').value=d.GioRa?.slice(0,5)||'17:00'; document.getElementById('fSoGioLam').value=d.SoGioLam||8; document.getElementById('fTangCa').value=d.TangCa||0; document.getElementById('fTrangThai').value=d.TrangThai||'Đúng giờ'; bsModal().show(); }
    function delItem(id){ showConfirm('Xóa bản ghi chấm công này?','Xóa',async()=>{ const res=await API.del(`/attendance/${id}`); res?.ok?(showToast('Đã xóa','success'),loadData()):showToast('Lỗi xóa','danger'); }); }
    document.getElementById('btnSave').addEventListener('click', async()=>{
        const data={maNhanVien:document.getElementById('fNhanVien').value, ngayLam:document.getElementById('fNgayLam').value, gioVao:document.getElementById('fGioVao').value, gioRa:document.getElementById('fGioRa').value, soGioLam:document.getElementById('fSoGioLam').value, tangCa:document.getElementById('fTangCa').value, trangThai:document.getElementById('fTrangThai').value};
        if(!data.maNhanVien||!data.ngayLam) return showToast('Chọn nhân viên và ngày làm','warning');
        const res=editId?await API.put(`/attendance/${editId}`,data):await API.post('/attendance',data);
        if(res?.ok){showToast('Lưu thành công','success');bsModal().hide();loadData();}else showToast(res?.data?.message||'Lỗi lưu','danger');
    });
    ['filterThang','filterNam'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{currentPage=1;loadData();}));
    document.getElementById('filterSearch').addEventListener('input',debounce(()=>{currentPage=1;loadData();},400));
    document.getElementById('btnRefresh').addEventListener('click',loadData);
    loadData();
</script>
</body>
</html>
