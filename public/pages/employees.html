<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Sự - Hatechno HRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Header -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">HATECHNO HRM</a>
        <div class="d-flex text-white align-items-center">
            <span class="me-3" id="currentUserDisplay"><i class="fa-solid fa-user-circle me-1"></i> Phạm Văn Vũ</span>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">Đăng xuất</button>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-2 mb-3">
            <div class="list-group shadow-sm">
                <a href="/employees" class="list-group-item list-group-item-action active">
                    <i class="fa-solid fa-users me-2"></i> Nhân sự
                </a>
                <a href="/attendance" class="list-group-item list-group-item-action">
                    <i class="fa-solid fa-calendar-check me-2"></i> Chấm công
                </a>
                <a href="/salary" class="list-group-item list-group-item-action">
                    <i class="fa-solid fa-money-bill-wave me-2"></i> Tính lương
                </a>
            </div>
        </div>

        <!-- Content Area -->
        <div class="col-md-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 fw-bold text-primary">Danh Sách Nhân Viên</h5>
                    <!-- Nút kích hoạt Modal Pop-up -->
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">
                        <i class="fa-solid fa-plus me-1"></i> Thêm Nhân Viên
                    </button>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0" id="employeeTable">
                        <thead class="table-light">
                        <tr>
                            <th>Mã NV</th>
                            <th>Họ và Tên</th>
                            <th>Phòng ban</th>
                            <th>Chức vụ</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- API dữ liệu nhân viên sẽ được load vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL THÊM NHÂN VIÊN (Pop-up) -->
<div class="modal fade" id="addEmployeeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">Thêm Nhân Viên Mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addEmployeeForm">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Mã Nhân Viên</label>
                        <input type="text" class="form-control" id="empCode" placeholder="NV002">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Họ và Tên</label>
                        <input type="text" class="form-control" id="empName" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phòng ban</label>
                        <select class="form-select" id="empDept">
                            <!-- Dynamically loaded -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Chức vụ</label>
                        <select class="form-select" id="empRole">
                            <!-- Dynamically loaded -->
                        </select>
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Lưu nhân viên</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- MODAL SỬA NHÂN VIÊN (Pop-up) -->
<div class="modal fade" id="editEmployeeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title fw-bold">Chỉnh Sửa Thông Tin Nhân Viên</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editEmployeeForm">
                    <input type="hidden" id="editEmpId">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Mã Nhân Viên</label>
                        <input type="text" class="form-control" id="editEmpCode" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Họ và Tên</label>
                        <input type="text" class="form-control" id="editEmpName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Điện thoại</label>
                        <input type="text" class="form-control" id="editEmpPhone" placeholder="0901234567">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmpEmail" placeholder="email@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phòng ban</label>
                        <select class="form-select" id="editEmpDept">
                            <!-- Dynamically loaded -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Chức vụ</label>
                        <select class="form-select" id="editEmpRole">
                            <!-- Dynamically loaded -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" id="editEmpStatus">
                            <option value="DangLam">Chính thức (Đang làm)</option>
                            <option value="DaNghi">Đã nghỉ việc</option>
                        </select>
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-warning fw-bold">Cập Nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Kiểm tra và hiển thị người dùng đăng nhập
    const userStr = localStorage.getItem('hrm_user');
    if (userStr) {
        const u = JSON.parse(userStr);
        document.getElementById('currentUserDisplay').innerHTML = `<i class="fa-solid fa-user-circle me-1"></i> ${u.hoTen || u.tenDangNhap}`;
    }

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('hrm_token');
        localStorage.removeItem('hrm_user');
        window.location.href = '/login';
    });

    let departmentsList = [];
    let positionsList = [];

    // Tải danh sách Phòng ban & Chức vụ cho Select Dropdowns
    async function loadOptions() {
        try {
            const token = localStorage.getItem('hrm_token');
            const [deptRes, posRes] = await Promise.all([
                fetch('/api/departments', { headers: { 'Authorization': `Bearer ${token}` } }),
                fetch('/api/positions', { headers: { 'Authorization': `Bearer ${token}` } })
            ]);
            const deptData = await deptRes.json();
            const posData = await posRes.json();

            if (deptData.success) {
                departmentsList = deptData.data;
                const deptOptions = departmentsList.map(d => `<option value="${d.MaPhongBan}">${d.TenPhongBan}</option>`).join('');
                document.getElementById('empDept').innerHTML = deptOptions;
                document.getElementById('editEmpDept').innerHTML = deptOptions;
            }

            if (posData.success) {
                positionsList = posData.data;
                const posOptions = positionsList.map(p => `<option value="${p.MaChucVu}">${p.TenChucVu}</option>`).join('');
                document.getElementById('empRole').innerHTML = posOptions;
                document.getElementById('editEmpRole').innerHTML = posOptions;
            }
        } catch(err) {
            console.error('Lỗi tải danh mục phòng ban / chức vụ:', err);
        }
    }

    // Fetch danh sách nhân viên từ Backend API
    async function loadEmployees() {
        try {
            const token = localStorage.getItem('hrm_token');
            const res = await fetch('/api/employees', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await res.json();
            if (result.success && result.data) {
                const tbody = document.querySelector('#employeeTable tbody');
                tbody.innerHTML = result.data.map(e => `
                    <tr>
                        <td><strong>${e.MaNV}</strong></td>
                        <td>${e.HoTen}</td>
                        <td>${e.TenPhongBan || 'N/A'}</td>
                        <td>${e.TenChucVu || 'N/A'}</td>
                        <td><span class="badge ${e.TrangThai === 'DangLam' ? 'bg-success' : 'bg-secondary'}">${e.TrangThai === 'DangLam' ? 'Chính thức' : 'Đã nghỉ'}</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editEmp(${e.MaNhanVien})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger btn-delete" onclick="deleteEmp(${e.MaNhanVien})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch(err) {
            console.error(err);
        }
    }

    // Mở modal sửa nhân viên
    async function editEmp(id) {
        try {
            const token = localStorage.getItem('hrm_token');
            const res = await fetch(`/api/employees/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await res.json();
            if (result.success && result.data) {
                const emp = result.data;
                document.getElementById('editEmpId').value = emp.MaNhanVien;
                document.getElementById('editEmpCode').value = emp.MaNV || '';
                document.getElementById('editEmpName').value = emp.HoTen || '';
                document.getElementById('editEmpPhone').value = emp.DienThoai || '';
                document.getElementById('editEmpEmail').value = emp.Email || '';
                if (emp.MaPhongBan) document.getElementById('editEmpDept').value = emp.MaPhongBan;
                if (emp.MaChucVu) document.getElementById('editEmpRole').value = emp.MaChucVu;
                document.getElementById('editEmpStatus').value = emp.TrangThai || 'DangLam';

                const editModal = new bootstrap.Modal(document.getElementById('editEmployeeModal'));
                editModal.show();
            } else {
                alert(result.message || 'Không lấy được thông tin nhân viên');
            }
        } catch(err) {
            console.error('Lỗi lấy thông tin nhân viên:', err);
            alert('Lỗi tải thông tin nhân viên');
        }
    }

    // Xóa nhân viên
    async function deleteEmp(id) {
        if (!confirm('Bạn có chắc chắn muốn xóa nhân viên này?')) return;
        const token = localStorage.getItem('hrm_token');
        const res = await fetch(`/api/employees/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            alert('Xóa thành công!');
            loadEmployees();
        } else {
            alert(data.message || 'Lỗi khi xóa!');
        }
    }

    // Xử lý submit Form Thêm Nhân Viên
    document.getElementById('addEmployeeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const maNV = document.getElementById('empCode').value;
        const hoTen = document.getElementById('empName').value;
        const maPhongBan = document.getElementById('empDept').value;
        const maChucVu = document.getElementById('empRole').value;

        const token = localStorage.getItem('hrm_token');
        const formData = new FormData();
        if (maNV) formData.append('maNV', maNV);
        formData.append('hoTen', hoTen);
        formData.append('maPhongBan', maPhongBan);
        formData.append('maChucVu', maChucVu);

        const res = await fetch('/api/employees', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
        });
        const data = await res.json();
        if (data.success) {
            alert('Thêm nhân viên thành công!');
            bootstrap.Modal.getInstance(document.getElementById('addEmployeeModal')).hide();
            document.getElementById('addEmployeeForm').reset();
            loadEmployees();
        } else {
            alert(data.message || 'Lỗi thêm nhân viên!');
        }
    });

    // Xử lý submit Form Sửa Nhân Viên
    document.getElementById('editEmployeeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const id = document.getElementById('editEmpId').value;
        const maNV = document.getElementById('editEmpCode').value;
        const hoTen = document.getElementById('editEmpName').value;
        const dienThoai = document.getElementById('editEmpPhone').value;
        const email = document.getElementById('editEmpEmail').value;
        const maPhongBan = document.getElementById('editEmpDept').value;
        const maChucVu = document.getElementById('editEmpRole').value;
        const trangThai = document.getElementById('editEmpStatus').value;

        const token = localStorage.getItem('hrm_token');
        const formData = new FormData();
        formData.append('maNV', maNV);
        formData.append('hoTen', hoTen);
        formData.append('dienThoai', dienThoai);
        formData.append('email', email);
        formData.append('maPhongBan', maPhongBan);
        formData.append('maChucVu', maChucVu);
        formData.append('trangThai', trangThai);

        const res = await fetch(`/api/employees/${id}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
        });
        const data = await res.json();
        if (data.success) {
            alert('Cập nhật nhân viên thành công!');
            bootstrap.Modal.getInstance(document.getElementById('editEmployeeModal')).hide();
            loadEmployees();
        } else {
            alert(data.message || 'Lỗi cập nhật nhân viên!');
        }
    });

    // Khởi tạo trang
    async function init() {
        await loadOptions();
        await loadEmployees();
    }
    init();
</script>
</body>
</html>
