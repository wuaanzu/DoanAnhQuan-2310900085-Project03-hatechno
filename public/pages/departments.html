<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng ban - HATECHNO HRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<div class="app-layout">
    <div class="sidebar-wrapper"><div id="sidebar"></div></div>
    <div class="content-wrapper">
        <div id="topNavbar"></div>
        <div class="page-content">
            <div class="page-header">
                <h5><span class="page-icon"><i class="fa-solid fa-building"></i></span>Quản lý Phòng ban</h5>
                <button class="btn btn-primary btn-sm" id="btnAdd"><i class="fa-solid fa-plus me-2"></i>Thêm phòng ban</button>
            </div>
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light"><tr><th>STT</th><th>Tên phòng ban</th><th>Trưởng phòng</th><th>Số nhân viên</th><th>Mô tả</th><th class="text-center">Thao tác</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="mainModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white"><h5 class="modal-title fw-bold" id="modalTitle">Phòng ban</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="mainForm"><input type="hidden" id="itemId">
                    <div class="mb-3"><label class="form-label fw-semibold">Tên phòng ban <span class="text-danger">*</span></label><input type="text" class="form-control" id="fTen" placeholder="Phòng Nhân sự" required></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Trưởng phòng</label><select class="form-select" id="fTruong"><option value="">-- Chọn trưởng phòng --</option></select></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Mô tả</label><textarea class="form-control" id="fMoTa" rows="3"></textarea></div>
                </form>
            </div>
            <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" id="btnSave"><i class="fa-solid fa-floppy-disk me-2"></i>Lưu</button></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
requireAuth(); renderLayout('departments');
let editId = null;
const bsModal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('mainModal'));

async function loadData() {
    const res = await API.get('/departments');
    const data = res?.data?.data || [];
    const isManager = hasRole(['Admin','NhanSu']);
    document.getElementById('tableBody').innerHTML = data.length
        ? data.map((d,i) => `<tr>
            <td>${i+1}</td>
            <td><strong>${fmt.esc(d.TenPhongBan)}</strong></td>
            <td class="small">${fmt.esc(d.TruongPhong||'--')}</td>
            <td><span class="badge bg-primary-subtle text-primary">${d.SoNhanVien||0} nhân viên</span></td>
            <td class="small text-muted">${fmt.esc(d.MoTa||'--')}</td>
            <td class="text-center"><div class="d-flex gap-1 justify-content-center">
                ${isManager ? `
                <button class="btn btn-sm btn-outline-primary" onclick="editItem(${d.MaPhongBan})"><i class="fa-solid fa-pen"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="delItem(${d.MaPhongBan},'${fmt.esc(d.TenPhongBan)}')"><i class="fa-solid fa-trash"></i></button>
                ` : '--'}
            </div></td>
        </tr>`).join('')
        : `<tr><td colspan="6" class="text-center py-5 text-muted"><i class="fa-solid fa-building fa-2x mb-2 d-block"></i>Chưa có phòng ban</td></tr>`;
}

async function loadManagers() {
    const res = await API.get('/employees/simple');
    const sel = document.getElementById('fTruong');
    sel.innerHTML = '<option value="">-- Chọn trưởng phòng --</option>' + (res?.data?.data||[]).map(e => `<option value="${e.MaNhanVien}">${fmt.esc(e.HoTen)}</option>`).join('');
}

document.getElementById('btnAdd').addEventListener('click', () => {
    editId = null;
    document.getElementById('mainForm').reset();
    document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-building me-2"></i>Thêm phòng ban';
    loadManagers();
    bsModal().show();
});

async function editItem(id) {
    const res = await API.get(`/departments/${id}`);
    if (!res?.ok) return;
    const d = res.data.data; editId = id;
    await loadManagers();
    document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen me-2"></i>Cập nhật phòng ban';
    document.getElementById('fTen').value = d.TenPhongBan;
    document.getElementById('fTruong').value = d.TruongPhong||'';
    document.getElementById('fMoTa').value = d.MoTa||'';
    bsModal().show();
}

function delItem(id, name) {
    showConfirm(`Xóa phòng ban <strong>${name}</strong>?`, 'Xóa phòng ban', async () => {
        const res = await API.del(`/departments/${id}`);
        res?.ok ? (showToast('Đã xóa','success'), loadData()) : showToast(res?.data?.message||'Lỗi xóa','danger');
    });
}

document.getElementById('btnSave').addEventListener('click', async () => {
    const data = { tenPhongBan: document.getElementById('fTen').value.trim(), truongPhong: document.getElementById('fTruong').value||null, moTa: document.getElementById('fMoTa').value };
    if (!data.tenPhongBan) return showToast('Vui lòng nhập tên phòng ban','warning');
    const res = editId ? await API.put(`/departments/${editId}`, data) : await API.post('/departments', data);
    if (res?.ok) { showToast(editId?'Cập nhật thành công':'Thêm thành công','success'); bsModal().hide(); loadData(); }
    else showToast(res?.data?.message||'Lỗi lưu','danger');
});

loadData();
</script>
</body>
</html>
