<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hatechno HRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-subtle d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-lg border-0 style-card" style="width: 400px; border-radius: 12px;">
    <div class="card-body p-4">
        <!-- Logo / Brand -->
        <div class="text-center mb-4">
            <i class="fa-solid fa-building-user text-primary display-4 mb-2"></i>
            <h3 class="fw-bold text-dark">HATECHNO HRM</h3>
            <p class="text-muted small">Hệ thống Quản lý Nhân sự & Tiền lương</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Tên đăng nhập / Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Ghi nhớ đăng nhập</label>
                </div>
                <a href="#" class="small text-decoration-none">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng nhập
            </button>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: username, password })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('hrm_token', data.token);
                localStorage.setItem('hrm_user', JSON.stringify(data.user));
                window.location.href = '/employees';
            } else {
                alert(data.message || 'Đăng nhập thất bại!');
            }
        } catch(err) {
            alert('Lỗi kết nối máy chủ!');
        }
    });
</script>
</body>
</html>
